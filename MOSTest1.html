    <script>
        const quizData = [
            // ================== CHƯƠNG 1 (7 Câu) ==================
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Theo khái niệm 'Bộ quản lý tài nguyên' (Resource Manager), Hệ điều hành thực hiện chia sẻ tài nguyên theo hai chiều hướng nào?", 
                options: ["User mode và Kernel mode.", "Thời gian (Time multiplexing) và Không gian (Space multiplexing).", "Phần cứng và Phần mềm.", "Mạng cục bộ và Mạng diện rộng."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> Khía cạnh <i>Resource Manager</i> là vai trò của HĐH trong việc phân bổ tài nguyên phần cứng (CPU, RAM, I/O) cho các tiến trình đang cạnh tranh nhau một cách trật tự.<br><br><b>Phân tích:</b> Về mặt học thuật, HĐH quản lý theo 2 trục: <i>Thời gian</i> (luân phiên sử dụng) và <i>Không gian</i> (chia nhỏ diện tích lưu trữ). Nói dân dã, HĐH giống như một bà chủ nhà trọ: Bà ấy chia "Không gian" bằng cách cắt ngôi nhà thành nhiều phòng cho từng người thuê (chia RAM cho các tiến trình). Đồng thời, bà ấy chia "Thời gian" bằng cách quy định mỗi người chỉ được dùng máy giặt chung 30 phút rồi đến lượt người khác (chia thời gian CPU).`, 
                citation: "Chương 1.1.2: The OS as a Resource Manager." 
            },
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Trong lịch sử phát triển, sự đột phá quan trọng nhất của Thế hệ thứ 3 (1965-1980) giúp CPU không bị lãng phí khi chờ thao tác Vào/Ra (I/O) là kỹ thuật gì?", 
                options: ["Sử dụng thẻ đục lỗ.", "Kỹ thuật Xử lý lô (Batch processing).", "Kỹ thuật Đa chương trình (Multiprogramming).", "Giao diện đồ họa người dùng (GUI)."], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> <i>Multiprogramming</i> (Đa chương trình) là kỹ thuật chia bộ nhớ chính (RAM) thành nhiều phân vùng để chứa nhiều chương trình (Job) cùng lúc.<br><br><b>Phân tích:</b> Trước thế hệ thứ 3, CPU cực kỳ lãng phí. Khi chương trình đọc dữ liệu từ băng từ (rất chậm), CPU phải ngồi chơi xơi nước. Nhờ <i>Multiprogramming</i>, HĐH nạp sẵn 3-4 Job vào RAM. Khi Job 1 vấp phải ổ đĩa và phải đợi (Blocked), CPU ngay lập tức được "sang số" để chạy Job 2. Hiểu nôm na như một anh thợ xây: Đợi thợ phụ đi xách vữa (chờ I/O), anh thợ xây không ngồi hút thuốc mà quay sang trát bức tường khác ngay lập tức, giữ cho CPU luôn bận rộn 100%.`, 
                citation: "Chương 1.2.3: The Third Generation (Multiprogramming)." 
            },
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Khi một chương trình ứng dụng (User mode) cố gắng thực thi một lệnh đặc quyền (Privileged instruction) như tắt ngắt phần cứng, điều gì sẽ xảy ra?", 
                options: ["CPU sẽ tự động bỏ qua lệnh đó và chạy lệnh tiếp theo.", "Chương trình sẽ tự động chuyển sang Kernel mode.", "Phần cứng CPU từ chối thực hiện và sinh ra một Ngắt bẫy (Trap) trả quyền điều khiển về Hệ điều hành để xử lý lỗi.", "Toàn bộ hệ thống bị khởi động lại."], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> Lệnh đặc quyền (Privileged instruction) là những câu lệnh cấp thấp có khả năng thay đổi trạng thái của toàn bộ hệ thống (như tắt ngắt, đổi Mode bit). Chỉ có Kernel Mode mới được quyền chạy.<br><br><b>Phân tích:</b> Khi <i>Mode bit = 1 (User mode)</i>, mọi âm mưu gọi lệnh đặc quyền đều bị CPU coi là hành vi xâm nhập trái phép. Phần cứng sẽ lập tức bắt quả tang, phát ra một cái bẫy lỗi (Trap - Ngắt mềm) và đánh thức HĐH dậy xử lý. Dân dã mà nói: Ứng dụng giống như nhân viên thường đi nhầm vào phòng Giám đốc, chưa kịp làm gì thì đã bị hệ thống cửa cảm biến (Phần cứng CPU) rú còi báo động (Trap) gọi bảo vệ (Hệ điều hành) lên tóm cổ và ném ra ngoài.`, 
                citation: "Chương 1.3: Dual-Mode Operation." 
            },
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Thiết bị DMA (Direct Memory Access) mang lại lợi ích gì cho hệ thống?", 
                options: ["Tăng dung lượng của đĩa cứng.", "Giúp CPU không phải tham gia vào việc truyền từng byte dữ liệu giữa thiết bị I/O và RAM, giảm số lượng ngắt xuống chỉ còn 1 ngắt cho toàn bộ khối dữ liệu.", "Biên dịch mã nguồn thành mã máy.", "Thay thế hoàn toàn bộ nhớ Cache."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <i>DMA</i> (Truy cập bộ nhớ trực tiếp) là một con chip điều khiển phần cứng đặc biệt, có khả năng tự động bơm dữ liệu từ thiết bị ngoại vi thẳng vào RAM mà không cần CPU nhúng tay vào.<br><br><b>Phân tích:</b> Nếu không có DMA, mỗi byte dữ liệu đọc từ ổ cứng vào RAM sẽ tạo ra 1 tiếng gõ cửa (Ngắt - Interrupt) bắt CPU phải ra mở. Đọc 1MB thì CPU bị làm phiền 1 triệu lần, không còn thời gian làm việc khác. Với DMA, CPU đóng vai trò "sếp", ra lệnh: <i>'Ê DMA, tao cần 1MB dữ liệu ở ổ D, chép thẳng vào góc kia của RAM cho tao'</i>. DMA tự hùng hục làm, chép xong 1MB nó mới gõ cửa báo cáo sếp đúng 1 lần. CPU nhàn rỗi hơn rất nhiều.`, 
                citation: "Chương 1.3.4: I/O Devices (DMA)." 
            },
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Trong chuẩn POSIX, một tiến trình muốn nhân bản chính nó thành một tiến trình con giống hệt, nó sẽ sử dụng System Call nào?", 
                options: ["spawn()", "execve()", "fork()", "CreateProcess()"], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> <code>fork()</code> là Lời gọi hệ thống (System Call) chuẩn của dòng họ UNIX/Linux, dùng để tạo ra một tiến trình mới.<br><br><b>Phân tích:</b> Triết lý của UNIX rất đặc biệt: Nó không tạo tiến trình mới từ hư không. Khi gọi <code>fork()</code>, tiến trình hiện tại (Cha) sẽ tự phân bào, tạo ra một tiến trình mới (Con) là bản sao clone giống hệt cha đến từng byte bộ nhớ. Cha và con sau đó sẽ chạy độc lập. Để tối ưu tốc độ phân bào, OS thường xài chiêu <i>Copy-on-write</i> (chỉ sao chép thực sự khi có đứa đòi sửa dữ liệu).`, 
                citation: "Chương 1.5.1: Process Management System Calls." 
            },
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Cơ chế 'Tách biệt giữa Chính sách và Cơ chế' (Separation of Policy and Mechanism) được thể hiện như thế nào?", 
                options: ["HĐH cài đặt thuật toán gán mức ưu tiên (Cơ chế), còn người dùng/tiến trình tự quyết định ai được ưu tiên cao hơn (Chính sách).", "Tách rời chuột và bàn phím.", "Viết HĐH bằng hai ngôn ngữ lập trình khác nhau.", "Tách rời CPU và RAM."], 
                correct: 0, 
                explanation: `<b>Khái niệm:</b> Đây là nguyên lý thiết kế phần mềm kinh điển: Phân tách rõ ràng giữa <b>Làm thế nào để thực hiện</b> (Cơ chế) và <b>Thực hiện cái gì/cho ai</b> (Chính sách).<br><br><b>Phân tích:</b> HĐH viết sẵn một chức năng định thời cực mạnh trong Kernel (đây là Cơ chế - Mechanism). Nhưng HĐH không tự quyết định ai quan trọng hơn ai. Người quản trị mạng hoặc người dùng sẽ truyền tham số (như gõ lệnh <code>nice -n 10</code>) để ưu tiên ứng dụng của họ (đây là Chính sách - Policy). Dân dã mà nói: HĐH cung cấp chiếc xe đua và bộ vô lăng cực nhạy (Cơ chế), nhưng bẻ lái sang trái hay phải là quyền quyết định của người cầm lái (Chính sách).`, 
                citation: "Chương 1: OS Design Concepts." 
            },
            { 
                category: "Chương 1: Tổng quan & Cơ sở", 
                q: "Kiến trúc hệ điều hành Microkernel (Vi nhân) giải quyết vấn đề phình to của Monolithic (Nhân nguyên khối) bằng cách nào?", 
                options: ["Đưa toàn bộ phần mềm ứng dụng vào nhân HĐH.", "Đẩy hầu hết các dịch vụ HĐH (như File System, Process Manager) ra ngoài không gian User mode dưới dạng các tiến trình Server, giữ Kernel cực kỳ nhỏ gọn.", "Bỏ hoàn toàn việc sử dụng System calls.", "Sử dụng mã hóa đám mây."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <i>Microkernel</i> là kiến trúc hệ điều hành trong đó hạt nhân (Kernel) được gọt giũa nhỏ nhất có thể, chỉ chứa các tính năng sống còn (như giao tiếp IPC, định thời cơ bản).<br><br><b>Phân tích:</b> Ở kiến trúc cũ (Monolithic), trình quản lý File, RAM, Đĩa đều nhét hết vào Kernel. Nếu cái driver File System bị lỗi (bug), nó sẽ kéo sập toàn bộ hệ thống (Màn hình xanh). Microkernel đẩy File System ra ngoài chạy như một ứng dụng bình thường (chạy ở User Mode). Về mặt dân dã: Thay vì ôm đồm mọi việc vào tay sếp (Kernel), sếp chỉ đứng giữa làm cầu nối truyền tin. Các phòng ban (File, Memory) tự làm việc riêng. Nếu phòng File bị cháy, sếp chỉ việc dập lửa và mở phòng File mới, cả công ty vẫn hoạt động bình thường, độ ổn định tuyệt đối!`, 
                citation: "Chương 1.6.4: Microkernels." 
            },

            // ================== CHƯƠNG 2: TIẾN TRÌNH & LUỒNG (6 Câu) ==================
            { 
                category: "Chương 2: Tiến trình & Luồng", 
                q: "Vòng đời của một Tiến trình gồm 3 trạng thái cơ bản. Chuyển đổi từ trạng thái Running (Đang chạy) sang Blocked (Bị chặn) xảy ra khi nào?", 
                options: ["Khi HĐH quyết định hết thời gian (Quantum).", "Khi tiến trình gọi System Call yêu cầu I/O (ví dụ <code>read</code>) và phải CHỜ đợi dữ liệu.", "Khi tiến trình hoàn tất công việc.", "Khi có sự kiện phần cứng hoàn tất."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> 3 trạng thái của Tiến trình gồm: Running (chiếm CPU), Ready (chờ HĐH cấp CPU), và Blocked (chờ tài nguyên bên ngoài).<br><br><b>Phân tích:</b> Sự chuyển đổi từ Running &rarr; Blocked là thao tác TỰ NGUYỆN. Tiến trình đang chạy ngon ơ nhưng cần đọc file từ ổ cứng. Ổ cứng thì rất chậm, nên tiến trình thông báo: <i>'OS ơi, tôi kẹt không đi tiếp được vì thiếu dữ liệu, tôi xin phép đi ngủ'</i>. Nói dân dã: Đang nấu ăn (Running) mà phát hiện hết nước mắm, bạn phải tắt bếp đứng chờ shipper (Blocked). Không ai ép bạn, do bạn tự thiếu đồ nên phải dừng lại thôi.`, 
                citation: "Chương 2.1.2: Process States." 
            },
            { 
                category: "Chương 2: Tiến trình & Luồng", 
                q: "Bảng tiến trình (Process Table / PCB) lưu trữ điều gì?", 
                options: ["Mã nguồn gốc của chương trình (.c, .java).", "Danh sách các hệ điều hành đã được cài đặt.", "Mọi thông tin về trạng thái tiến trình: Các thanh ghi CPU, Program Counter, Stack Pointer, danh sách File mở... để HĐH có thể phục hồi nó sau khi Context Switch.", "Hình nền Desktop của User."], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> Bảng tiến trình (Process Control Block - PCB) là cấu trúc dữ liệu khổng lồ do OS quản lý, đóng vai trò như 'hồ sơ lý lịch' của mọi tiến trình trong máy.<br><br><b>Phân tích:</b> Khi HĐH tước CPU của một tiến trình, nó phải 'chụp ảnh' lại mọi thứ: Tiến trình đang chạy đến dòng code thứ mấy (Program Counter)? Biến cục bộ đang tính dở bằng bao nhiêu (Registers)? Bức ảnh này được cất cẩn thận vào PCB. Lát sau đến lượt chạy lại, OS lôi PCB ra, đắp ngược bức ảnh đó vào CPU để tiến trình chạy tiếp như chưa hề có cuộc chia ly. Code dạng chữ (.java, .c) không bao giờ nằm trong PCB, vì lúc này nó đã biên dịch thành nhị phân rồi.`, 
                citation: "Chương 2.1.6: Implementation of Processes." 
            },
            { 
                category: "Chương 2: Tiến trình & Luồng", 
                q: "Khác biệt cốt lõi nhất khi chạy Đa luồng (Multithreading) so với Đa tiến trình (Multiprocessing) là gì?", 
                options: ["Các luồng chạy chậm hơn các tiến trình.", "Các luồng trong cùng một tiến trình CHIA SẺ chung Không gian địa chỉ (Address Space) và các biến toàn cục. Các tiến trình thì độc lập hoàn toàn về bộ nhớ.", "Luồng không cần CPU để chạy.", "Tiến trình không cần RAM."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <i>Multithreading</i> là chia một Tiến trình thành nhiều Luồng nhỏ, mỗi luồng đảm nhận một nhánh thực thi độc lập nhưng cùng sống trong chung một cái vỏ Tiến trình.<br><br><b>Phân tích:</b> Các Process bị OS cách ly tuyệt đối, anh này không được nhòm ngó RAM của anh kia. Nhưng các Thread trong cùng 1 Process thì bơi chung trong 1 hồ bơi (Shared Memory). Biến toàn cục <code>X</code> mà Thread A đổi thành 10, Thread B lập tức nhìn thấy số 10 đó. Dân dã: Hai Process như 2 công ty khác nhau, chuyển tài liệu phải gửi qua bưu điện (chậm). Hai Thread như 2 nhân viên ngồi chung một cái bàn làm việc, lấy tài liệu của nhau chỉ mất 1 giây (nhanh, nhưng dễ giành giật nhau gây lỗi).`, 
                citation: "Chương 2.2.2: The Classical Thread Model." 
            },
            { 
                category: "Chương 2: Tiến trình & Luồng", 
                q: "Dù chia sẻ không gian nhớ, NHƯNG mỗi Luồng (Thread) bắt buộc phải SỞ HỮU RIÊNG những tài nguyên nào để chạy độc lập?", 
                options: ["File descriptors và ổ cứng.", "Program Counter (Con trỏ lệnh), Registers (Thanh ghi CPU), và Stack (Ngăn xếp).", "IP address và Port.", "Biến toàn cục (Global variables)."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> Mặc dù Luồng chia sẻ Address Space, nhưng luồng là một 'thực thể thực thi' (Entity of Execution). Mỗi luồng phải có khả năng gọi các hàm (functions) khác nhau cùng lúc.<br><br><b>Phân tích:</b> Vì Luồng A có thể đang tính tổng, Luồng B đang tải file, nên Luồng A và B phải có <i>Program Counter</i> riêng để đánh dấu dòng lệnh của riêng mình. Hơn nữa, chúng phải có cái <i>Stack (Ngăn xếp)</i> riêng để chứa các biến cục bộ (ví dụ vòng lặp for <code>int i = 0</code> của A không được dẫm lên <code>int i = 0</code> của B).`, 
                citation: "Chương 2.2.2: The Classical Thread Model." 
            },
            { 
                category: "Chương 2: Tiến trình & Luồng", 
                q: "Nhược điểm tồi tệ nhất của Luồng mức người dùng (User-Level Threads - ULT) là gì?", 
                options: ["Không thể lập trình trên Windows.", "Nếu một luồng gọi System Call bị kẹt (Blocked), Kernel (không biết sự tồn tại của luồng) sẽ BLOCK TOÀN BỘ TIẾN TRÌNH. Các luồng khác đang rảnh rỗi cũng bị chết đứng theo.", "Quá trình chuyển ngữ cảnh quá chậm.", "Phải dùng bằng ngôn ngữ Assembly."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <i>ULT</i> là các luồng do Thư viện lập trình tạo ra, hệ điều hành (Kernel) hoàn toàn mù tịt, Kernel chỉ coi toàn bộ mớ đó là 1 Tiến trình duy nhất.<br><br><b>Phân tích:</b> Điểm nghẽn cổ chai: Vì Kernel chỉ thấy 1 thực thể (Tiến trình), nên nếu 1 luồng bên trong đó dại dột gọi hàm <code>read</code> đọc ổ đĩa (tốn thời gian), Kernel sẽ lập tức tước CPU và ném cả cái Tiến trình đó vào trạng thái Blocked. Mặc dù bên trong tiến trình đó có 9 luồng khác đang rảnh rỗi chờ tính toán, chúng cũng bị khóa chặt. Dân dã: Giống như công ty có 10 nhân viên, 1 nhân viên vi phạm pháp luật mà HĐH đóng cửa luôn cả tòa nhà, 9 người kia mất việc oan mạng.`, 
                citation: "Chương 2.2.4: Implementing Threads in User Space." 
            },
            { 
                category: "Chương 2: Tiến trình & Luồng", 
                q: "Hàm <code>pthread_yield()</code> trong chuẩn luồng POSIX mang ý nghĩa gì?", 
                options: ["Kết thúc vòng đời của luồng.", "Tự nguyện từ bỏ CPU, đưa luồng hiện tại về trạng thái Ready và cho phép một luồng khác chạy.", "Gây lỗi tràn bộ đệm.", "Yêu cầu cấp thêm RAM."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <code>yield()</code> là hành vi nhường nhịn lịch sự trong lập trình đa luồng (thường dùng ở mô hình ULT).<br><br><b>Phân tích:</b> Khác với Tiến trình bị HĐH thẳng tay chém (Preemptive) khi hết giờ, Luồng có thể chủ động gọi hàm <code>yield()</code> để báo cáo: <i>'Phần việc của tôi tạm thời chưa gấp, tôi tự nhường CPU cho các anh em khác trong nhóm chạy trước'</i>. Hành vi này đẩy luồng gọi lệnh từ trạng thái Running về trạng thái Ready xếp hàng lại từ đầu.`, 
                citation: "Chương 2.2.3: POSIX Threads." 
            },

            // ================== CHƯƠNG 2: IPC & ĐỒNG BỘ (6 Câu) ==================
            { 
                category: "Chương 2: IPC & Đồng bộ hóa", 
                q: "Khái niệm 'Miền tới hạn' (Critical Region) dùng để chỉ cái gì?", 
                options: ["Khu vực ổ cứng chứa Kernel.", "Một đoạn mã (Code) trong chương trình có thực hiện việc Đọc hoặc Ghi vào một tài nguyên bộ nhớ/dữ liệu dùng chung. Cần được bảo vệ để tránh Race Condition.", "Thời gian CPU bị treo.", "Khu vực RAM bị lỗi (Bad sectors)."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <i>Critical Region</i> (hay Critical Section) là một đoạn code chứa các lệnh có nguy cơ gây xung đột dữ liệu nếu bị nhiều luồng chạy cùng lúc.<br><br><b>Phân tích:</b> Bất kỳ thao tác nào chạm tay vào 'đồ dùng chung' (biến toàn cục, file, cơ sở dữ liệu) đều tạo thành một miền tới hạn. Nguyên lý đồng bộ hóa tối thượng là: Không bao giờ cho phép 2 tiến trình cùng lọt vào miền tới hạn tại một thời điểm. Dân dã: Miền tới hạn chính là buồng vệ sinh công cộng. Đồ dùng chung là cái bồn cầu. Luật bắt buộc là ai vào trước phải chốt cửa, người thứ 2 phải đứng xếp hàng chờ bên ngoài.`, 
                citation: "Chương 2.3.2: Critical Regions." 
            },
            { 
                category: "Chương 2: IPC & Đồng bộ hóa", 
                q: "Trong các giải pháp phần mềm, nhược điểm của 'Busy Waiting' (Chờ đợi bận rộn) là gì?", 
                options: ["Dữ liệu bị sai lệch.", "Tiến trình phải liên tục chạy vòng lặp vô hạn (VD: <code>while(lock==1);</code>) để kiểm tra cửa mở chưa, làm tiêu tốn 100% tài nguyên CPU vô ích.", "Không thể dùng trên Linux.", "Tiến trình bị rơi vào trạng thái Blocked vĩnh viễn."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> <i>Busy Waiting (hay Spinlock)</i> là việc một tiến trình không đi vào trạng thái Blocked khi chờ tài nguyên, mà liên tục dùng vòng lặp để kiểm tra điều kiện.<br><br><b>Phân tích:</b> Mã lệnh <code>while(lock==1);</code> ép CPU phải xử lý liên tục câu hỏi 'Cửa mở chưa?'. Việc này thiêu đốt 100% công suất CPU một cách vô nghĩa, thay vì nhường CPU cho tiến trình khác thực sự có việc làm. Dân dã: Giống như bạn gõ cửa nhà vệ sinh liên tục 100 lần mỗi giây không ngừng nghỉ, bạn không đi làm việc khác mà còn làm hệ thống (CPU) mệt mỏi theo.`, 
                citation: "Chương 2.3.3: Mutual Exclusion with Busy Waiting." 
            },
            { 
                category: "Chương 2: IPC & Đồng bộ hóa", 
                q: "Lệnh phần cứng TSL (Test and Set Lock) giải quyết được bài toán loại trừ lẫn nhau nhờ đặc tính nào?", 
                options: ["Lệnh này khởi động lại hệ thống mạng.", "Lệnh này chạy chậm hơn bình thường để đảm bảo an toàn.", "Lệnh này là một hành động NGUYÊN TỬ (Atomic). Nó khóa bus bộ nhớ, Đọc giá trị cũ và Ghi giá trị 1 vào biến lock chỉ trong 1 chu kỳ phần cứng, không một CPU nào khác có thể xen vào giữa.", "Nó tắt màn hình đi."], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> <i>TSL</i> là một câu lệnh Assembly đặc quyền cung cấp bởi phần cứng CPU, hỗ trợ thao tác đọc và ghi liên tiếp mà không bị gián đoạn.<br><br><b>Phân tích:</b> Sự cố Race Condition luôn xảy ra vì thao tác 'Kiểm tra khóa rồi mới Chốt khóa' bị CPU ngắt giữa chừng. Lệnh TSL giải quyết bằng cơ chế phần cứng: Nó tạm thời khóa cứng toàn bộ Bus bộ nhớ RAM lại. Nó đọc biến <code>lock</code>, set biến bằng 1, rồi mới nhả RAM ra. Do là hành động 'Nguyên tử' (Atomic - Không thể bị chia cắt), không một luồng nào khác (thậm chí từ CPU Core khác) có thể lách vào giữa khe hở thời gian đó.`, 
                citation: "Chương 2.3.3: The TSL Instruction." 
            },
            { 
                category: "Chương 2: IPC & Đồng bộ hóa", 
                q: "Biến Semaphore (Dijkstra) khác với một biến số nguyên thông thường (int) ở điểm nào?", 
                options: ["Nó chỉ chứa số âm.", "Nó được lưu trữ trên Cloud.", "Các phép toán kiểm tra, trừ (DOWN) và cộng (UP) trên Semaphore được Hệ điều hành đảm bảo là NGUYÊN TỬ (Không thể bị chia cắt/ngắt giữa chừng).", "Nó được dùng để nhân hai ma trận."], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> <i>Semaphore</i> do E.W. Dijkstra phát minh, là một biến số nguyên được HĐH bảo vệ nghiêm ngặt để giải quyết lỗi 'Mất tín hiệu đánh thức' (Lost Wakeup).<br><br><b>Phân tích:</b> Bạn không thể dùng code <code>S = S - 1</code> bình thường để xin tài nguyên, vì thao tác trừ này bị tách làm 3 lệnh máy (Đọc, Trừ, Ghi), rất dễ bị Race Condition. Hàm <code>DOWN(S)</code> của Semaphore được hệ điều hành gói gọn lại thành 1 thao tác Nguyên tử tuyệt đối. HĐH tự động khóa ngắt, trừ S, nếu S = 0 HĐH sẽ đưa tiến trình đi ngủ an toàn. Bạn chỉ việc xài mà không bao giờ sợ lỗi đồng bộ.`, 
                citation: "Chương 2.3.5: Semaphores." 
            },
            { 
                category: "Chương 2: IPC & Đồng bộ hóa", 
                q: "Trong cấu trúc ngôn ngữ 'Monitor', điều gì làm cho lập trình viên tránh được các lỗi Deadlock dễ dính phải khi xài Semaphore?", 
                options: ["Trình biên dịch của Ngôn ngữ (Compiler) TỰ ĐỘNG chèn các khóa Mutex vào trước và sau các thủ tục của Monitor, đảm bảo tự động chỉ 1 luồng được vào tại 1 thời điểm.", "Monitor không dùng RAM.", "Monitor không cho phép lập trình viên chạy đa luồng.", "Monitor sẽ xóa file bị lỗi."], 
                correct: 0, 
                explanation: `<b>Khái niệm:</b> <i>Monitor</i> là một cấu trúc bậc cao (như từ khóa <code>synchronized</code> trong Java), gom các hàm và dữ liệu lại thành một khối an toàn.<br><br><b>Phân tích:</b> Nếu xài Semaphore, lập trình viên phải tự gõ lệnh <code>DOWN</code> và <code>UP</code>. Nếu gõ nhầm thứ tự, hệ thống treo ngay lập tức (Deadlock). Với Monitor, trình biên dịch (Compiler) sẽ tự động làm nhiệm vụ giữ cửa. Khi 1 luồng gọi hàm của Monitor, Compiler tự động chèn khóa vào. Luồng khác gọi tới sẽ tự động bị hất văng ra đứng chờ. Dân dã: Monitor giống như thuê một bảo vệ chuyên nghiệp đứng canh cửa, lập trình viên không cần tự mình đi chốt cửa bằng tay nữa, giảm thiểu 99% lỗi do 'não cá vàng' quên mở khóa.`, 
                citation: "Chương 2.3.7: Monitors." 
            },
            { 
                category: "Chương 2: IPC & Đồng bộ hóa", 
                q: "Trong bài toán kinh điển 'Người Đọc và Người Ghi' (Readers and Writers), điều luật nào là cốt lõi để bảo vệ dữ liệu?", 
                options: ["Chỉ có 1 người được Đọc tại 1 thời điểm.", "Nhiều người có thể cùng Đọc đồng thời. NHƯNG nếu có người Ghi, người đó phải sở hữu dữ liệu ĐỘC QUYỀN (Không ai khác được Đọc hay Ghi cùng lúc).", "Người Ghi có quyền sửa dữ liệu ngay cả khi có người đang Đọc.", "Tất cả cùng thao tác, OS tự sửa lỗi."], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> Bài toán quy định cách cấp khóa (Lock) cho cơ sở dữ liệu nơi thao tác Đọc diễn ra thường xuyên hơn Ghi.<br><br><b>Phân tích:</b> Thao tác 'Đọc' không làm thay đổi dữ liệu, nên hoàn toàn an toàn khi cho 100 người Đọc chui vào phòng cùng một lúc để tăng tốc độ hệ thống. Tuy nhiên, thao tác 'Ghi' (Sửa đổi) cực kỳ nguy hiểm. Luật là: Khi anh Ghi bước vào, anh ta phải khóa trái cửa lại tuyệt đối (Độc quyền). Không ai được Ghi cùng anh ta (tránh ghi đè), và không ai được Đọc lúc đó (tránh đọc nhầm dữ liệu đang sửa dở dang).`, 
                citation: "Chương 2.4.3: The Readers and Writers Problem." 
            },

            { 
                category: "Chương 2: Định thời (Lý thuyết)", 
                q: "Trong hệ thống Tương tác (Interactive Systems), tiêu chí (Goal) định thời nào là QUAN TRỌNG NHẤT?",

                explanation: `<b>Khái niệm:</b> Hệ thống tương tác là các máy tính PC, Mac, Smartphone nơi người dùng trực tiếp ra lệnh (click chuột, gõ phím) và chờ máy tính phản ứng.<br><br><b>Phân tích:</b> Đối với Server xử lý lô ban đêm, <i>Thông lượng</i> (càng làm nhiều việc càng tốt) là số 1. Nhưng với Laptop của bạn, nếu HĐH vì mải mê tối ưu Thông lượng mà bắt bạn chờ 5 giây sau khi gõ chữ 'A' thì chữ 'A' mới hiện ra màn hình, bạn sẽ phát điên và đập máy. Do đó, HĐH ưu tiên số 1 cho <i>Response Time</i> (Thời gian phản hồi tính bằng mili-giây) để tạo cảm giác mượt mà không độ trễ.`, 
                citation: "Chương 2.4.2: Scheduling Algorithm Goals." 
            },
            { 
                category: "Chương 2: Định thời (Lý thuyết)", 
                q: "Hiện tượng 'Đoàn tàu' (Convoy Effect) thường xảy ra với thuật toán định thời nào?", 
                options: ["Round Robin.", "FCFS (First-Come, First-Served) - Khi một tiến trình cực nặng chạy chiếm CPU, hàng loạt tiến trình nhỏ lẻ phải mòn mỏi đứng chờ phía sau.", "SJF (Shortest Job First).", "Earliest Deadline First."],

            { 
                category: "Bài tập Tính toán (Tự luận)", 
                q: "Một máy tính có 4GB RAM. Hệ điều hành chiếm 1GB. Mỗi chương trình ứng dụng yêu cầu 1GB RAM. Xác suất mỗi chương trình phải chờ I/O là $p = 70\\%$ (0.7). Hiệu suất sử dụng CPU (CPU Utilization) của hệ thống này là bao nhiêu?", 
                options: ["70%", "30%", "65.7%", "34.3%"], 
                correct: 2, 
                explanation: `<b>Khái niệm:</b> Mô hình xác suất Đa chương trình của Tanenbaum tính toán hiệu suất CPU bằng cách tìm xác suất CPU bị rảnh rỗi (khi TẤT CẢ các tiến trình đều cùng ngủ chờ I/O).<br><br><b>Phân tích & Tự luận:</b><br>
                <div class="calc-step">
                    1. <b>Tính số tiến trình (n) nạp được vào RAM:</b><br>
                    - Tổng RAM: 4GB. OS chiếm: 1GB &rarr; Còn trống: 3GB.<br>
                    - Mỗi tiến trình chiếm 1GB &rarr; Ta nạp được tối đa $n = 3 / 1 = 3$ tiến trình.<br><br>
                    2. <b>Sử dụng Mô hình xác suất:</b><br>
                    - Xác suất 1 tiến trình ngủ (chờ I/O) là $p = 0.7$.<br>
                    - Xác suất CẢ 3 tiến trình đều rủ nhau đi ngủ cùng lúc là: $p^n = 0.7^3 = 0.343$ (Tức CPU rảnh rỗi 34.3% thời gian).<br>
                    - Suy ra, Hiệu suất CPU (Thời gian CPU có ít nhất 1 người làm việc) là phần bù:<br>
                    $$ CPU\\_Utilization = 1 - p^n = 1 - 0.343 = 0.657 $$<br>
                    &rarr; <b>Đáp án: 65.7%</b>.
                </div>
                <i>Dân dã: Thuê 3 nhân viên, mỗi đứa có tật trốn đi vệ sinh 70% thời gian. Xác suất xưởng của bạn vắng tanh vì cả 3 đứa trốn cùng lúc là $0.7^3 = 34.3\\%$. Vậy thời gian xưởng có người làm là $65.7\\%$.</i>`, 
                citation: "Chương 2.1.7: Modeling Multiprogramming."

            { 
                category: "Bài tập Tính toán (Tự luận)", 
                q: "Có 4 tiến trình đến hệ thống CÙNG LÚC tại thời điểm t=0. Thời gian chạy (Burst time) của chúng lần lượt là: P1 = 8ms, P2 = 4ms, P3 = 4ms, P4 = 4ms. Sử dụng thuật toán SJF (Shortest Job First), Thời gian quay vòng trung bình (Average Turnaround Time) là bao nhiêu?", 
                options: ["11 ms", "14 ms", "20 ms", "12 ms"], 
                correct: 0, 
                explanation: `<b>Khái niệm:</b> <i>Shortest Job First (SJF)</i> ưu tiên thực thi các tác vụ có thời gian hoàn thành ngắn nhất trước, đã được chứng minh toán học là mang lại Thời gian quay vòng trung bình (Average Turnaround Time) tối ưu nhất.<br><br><b>Phân tích & Tự luận:</b><br>
                <div class="calc-step">
                    1. <b>Sắp xếp theo thuật toán SJF:</b><br>
                    - Độ dài các Job: P2(4), P3(4), P4(4), P1(8). (Việc ngắn được đẩy lên đầu).<br>
                    - Thứ tự chạy: P2 &rarr; P3 &rarr; P4 &rarr; P1.<br><br>
                    2. <b>Tính thời gian hoàn thành (Completion Time):</b><br>
                    Do tất cả đến ở t=0, thời gian hoàn thành chính là Turnaround Time.<br>
                    - P2 hoàn thành tại: $0 + 4 = 4$ ms.<br>
                    - P3 hoàn thành tại: $4 + 4 = 8$ ms.<br>

                    - P1 (béo nhất) hoàn thành tại: $12 + 8 = 20$ ms.<br><br>
                    3. <b>Tính trung bình:</b><br>
                    $$ Average\\_TAT = \\frac{4 + 8 + 12 + 20}{4} = \\frac{44}{4} = 11 \\text{ ms} $$<br>
                    &rarr; <b>Đáp án: 11 ms</b>.
                </div>`,

            {

            {

            { 
                category: "Bài tập Tính toán (Tự luận)", 
                q: "Trong IPC, một biến Semaphore Đếm (Counting Semaphore) có giá trị khởi tạo S = 3. Sau đó, có tất cả 7 phép toán <code>DOWN(S)</code> và 2 phép toán <code>UP(S)</code> được gọi ngẫu nhiên. Trạng thái của S và số lượng tiến trình đang bị Blocked (đi ngủ) là bao nhiêu?", 
                options: ["S = 0, Blocked = 2", "S = -2, Blocked = 2", "S = 2, Blocked = 0", "S = -2, Blocked = 7"], 
                correct: 1, 
                explanation: `<b>Khái niệm:</b> Semaphore là một biến số nguyên đại diện cho số lượng tài nguyên hiện có. Hàm <code>DOWN</code> (P) để xin tài nguyên (trừ 1), hàm <code>UP</code> (V) để nhả tài nguyên (cộng 1). Nếu Semaphore bị âm, giá trị tuyệt đối của nó chính là số lượng người đang phải xếp hàng (đi ngủ) để chờ.<br><br><b>Phân tích & Tự luận:</b><br>

                    - Số lượng tiến trình bị rơi vào trạng thái Blocked (ngủ đông) là: $|-2| = 2$ tiến trình.
                </div>`,

                qTitle.className = "font-semibold text-zinc-900 mb-5 text-base md:text-lg leading-relaxed";
                qTitle.innerHTML = `<span class="bg-zinc-900 text-white px-2 py-1 rounded text-sm mr-2 shadow-sm">Q${questionCounter}</span> ${qObj.q}`;
                qBlock.appendChild(qTitle);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = "flex flex-col gap-3";
                
                const answerDiv = document.createElement('div');
                answerDiv.className = "answer-block mt-6 clrs-proof rounded-lg";
                answerDiv.innerHTML = `
                    <h4 class="font-bold text-zinc-900 mb-3 flex items-center"><i class="fa-solid fa-graduation-cap text-blue-600 mr-2"></i> Lời giải & Phân tích chi tiết:</h4>
                    <div class="text-zinc-700 space-y-2 leading-relaxed">${qObj.explanation}</div>
                    <p class="text-xs font-mono text-zinc-500 mt-4 pt-3 border-t border-zinc-200"><i class="fa-solid fa-book-bookmark mr-2"></i>Tham chiếu giáo trình: ${qObj.citation}</p>
                `;

                let isAnswered = false;

                qObj.options.forEach((optText, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn text-left px-5 py-4 rounded-lg border border-zinc-200 text-zinc-700 bg-white hover:bg-zinc-50 hover:border-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm md:text-base font-medium shadow-sm";
                    
                    const charLabel = String.fromCharCode(65 + optIndex);
                    btn.innerHTML = `<span class="font-bold w-8 inline-block text-zinc-400">${charLabel}.</span> ${optText}`;

                    btn.addEventListener('click', () => {
                        if (isAnswered) return;
                        isAnswered = true;

                        const allBtns = optionsGrid.querySelectorAll('button');
                        allBtns.forEach((b, i) => {
                            b.classList.add('disabled');
                            b.classList.remove('hover:bg-zinc-50', 'hover:border-zinc-400');
                            
                            if (i === qObj.correct) {
                                b.classList.add('show-correct');
                                b.innerHTML += `<i class="fa-solid fa-check-circle float-right mt-1 text-emerald-600 text-lg"></i>`;
                            } 
                            else if (i === optIndex && i !== qObj.correct) {
                                b.classList.add('selected-wrong');
                                b.innerHTML += `<i class="fa-solid fa-times-circle float-right mt-1 text-rose-600 text-lg"></i>`;
                            }
                        });

                        if (optIndex === qObj.correct) {
                            score++;
                            scoreDisplay.innerText = `Điểm: ${score}/30`;
                            scoreDisplay.classList.add('bg-emerald-100', 'text-emerald-800');
                            setTimeout(() => {
                                scoreDisplay.classList.remove('bg-emerald-100', 'text-emerald-800');
                            }, 500);
                        }

                        if (window.MathJax) {
                            MathJax.typesetPromise([answerDiv]).then(() => {
                                answerDiv.classList.add('show');
                            });
                        } else {
                            answerDiv.classList.add('show');
                        }
                    });

                    optionsGrid.appendChild(btn);
                });

                qBlock.appendChild(optionsGrid);
                qBlock.appendChild(answerDiv);
                container.appendChild(qBlock);
                
                questionCounter++;
            });
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
