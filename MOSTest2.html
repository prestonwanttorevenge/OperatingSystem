                q: "Một hệ thống Real-time có 4 sự kiện tuần hoàn: E1 (20ms, 2ms); E2 (50ms, 10ms); E3 (100ms, 20ms); E4 (200ms, 40ms). Sử dụng điều kiện Rate Monotonic (RM), hệ thống này có lập lịch thành công không?",
                options: ["Có, tổng tải CPU là 70% (<= 100%).", "Không, tổng tải vượt 100%.", "Có, vì tổng tải đúng bằng 100%.", "Không, vì E1 chiếm quá nhiều thời gian."],
                correct: 0,
                explanation: `
                    <div class="calc-step">
                        <b>Giải tự luận chi tiết:</b><br>
                        - Tải E1: $2/20 = 0.10$<br>
                        - Tải E2: $10/50 = 0.20$<br>
                        - Tải E3: $20/100 = 0.20$<br>
                        - Tải E4: $40/200 = 0.20$<br>
                        - Tổng tải = $0.10 + 0.20 + 0.20 + 0.20 = 0.70$ (70%).<br>
                        Vì tổng tải 70% nhỏ hơn giới hạn lý thuyết RM cho 4 tác vụ ($\\approx 75.6\%$) và nhỏ hơn 100%, hệ thống lập lịch thành công 100%.<br>
                        $\\rightarrow$ <b>Đáp án: Có.</b>
                    </div>
                `,
                citation: "Chương 2.4.5: Rate Monotonic Schedulability Test."
            },
            {
                category: "Bài tập Tính toán Tự luận Nâng cao",
                q: "Biến Semaphore S khởi tạo S = 5. Thực thi lần lượt: 12 phép toán DOWN(S) và 7 phép toán UP(S). Hỏi giá trị cuối cùng của S và số lượng tiến trình bị chặn (Blocked) là bao nhiêu?",
                options: ["S = 0, Blocked = 0", "S = -2, Blocked = 2", "S = 2, Blocked = 0", "S = -7, Blocked = 7"],
                correct: 0,
                explanation: `
                    <div class="calc-step">
                        <b>Giải tự luận chi tiết:</b><br>
                        - Khởi tạo: $S = 5$.<br>
                        - Gọi 12 lần DOWN $\\rightarrow S = 5 - 12 = -7$.<br>
                        - Gọi 7 lần UP $\\rightarrow S = -7 + 7 = 0$.<br>
                        - Do $S = 0$ (không âm), không còn tiến trình nào phải ngủ đông.<br>
                        $\\rightarrow$ <b>Đáp án: S = 0, Blocked = 0</b>.
                    </div>
                `,
                citation: "Chương 2.3.5: Counting Semaphores Calculation."
            },
            {
                category: "Bài tập Tính toán Tự luận Nâng cao",
                q: "Banker's Algorithm: Cho Allocation = [[1, 0], [2, 1], [0, 3]], Max = [[3, 2], [3, 3], [2, 5]], Available = [1, 1]. (Gợi ý xét Available giả định ban đầu [2, 2]). Hỏi chuỗi an toàn là gì?",
                options: ["Không an toàn.", "P2 -> P1 -> P3", "P1 -> P2 -> P3", "P3 -> P1 -> P2"],
                correct: 1,
                explanation: `
                    <div class="calc-step">
                        <b>Giải tự luận chi tiết:</b><br>
                        - Need = Max - Allocation:<br>
                        + P1 Need = [2, 2]<br>
                        + P2 Need = [1, 2]<br>
                        + P3 Need = [2, 2]<br>
                        - Xét Avail = [2, 2]:<br>
                        + P2 cần [1, 2] <= [2, 2]. P2 chạy xong, trả lại [2, 1]. Avail mới = [4, 3].<br>
                        + P1 cần [2, 2] <= [4, 3]. P1 chạy xong, trả lại [1, 0]. Avail mới = [5, 3].<br>
                        + P3 cần [2, 2] <= [5, 3]. P3 chạy xong.<br>
                        - Chuỗi an toàn: <b>P2 -> P1 -> P3</b>.<br>
                        $\\rightarrow$ <b>Đáp án: An toàn với chuỗi: P2 -> P1 -> P3</b>.
                    </div>
                `,
                citation: "Chương 2.5.3: Banker's Algorithm Safety Check."
            },
            {
                category: "Bài tập Tính toán Tự luận Nâng cao",
                q: "Paging: Page size là 4KB (4096 bytes). Kích thước không gian logic của tiến trình là 16384 bytes. Tiến trình này chiếm bao nhiêu trang (Pages)?",
                options: ["2 trang", "4 trang", "8 trang", "16 trang"],
                correct: 1,
                explanation: `
                    <div class="calc-step">
                        <b>Giải tự luận chi tiết:</b><br>
                        - Số trang cần thiết = Kích thước tiến trình / Kích thước 1 trang<br>
                        $$ n = \\frac{16384 \\text{ bytes}}{4096 \\text{ bytes}} = 4 \\text{ trang} $$<br>
                        $\\rightarrow$ <b>Đáp án: 4 trang</b>.
                    </div>
                `,
                citation: "Chương 3: Paging Fundamentals."
            }
        ];

        let score = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('questions-list');
            let currentCategory = "";
            let questionCounter = 1;
            const scoreDisplay = document.getElementById('score-display');

            quizData.forEach((qObj) => {
                if (qObj.category !== currentCategory) {
                    currentCategory = qObj.category;
                    const sectionDivider = document.createElement('div');
                    sectionDivider.className = "mt-16 mb-8";
                    sectionDivider.id = `section-${currentCategory}`;
                    sectionDivider.innerHTML = `
                        <div class="flex items-center gap-4">
                            <h2 class="text-lg md:text-xl font-bold uppercase tracking-widest text-zinc-900 border-l-4 border-blue-600 pl-4 py-1">${currentCategory}</h2>
                            <div class="h-px bg-zinc-200 flex-grow"></div>
                        </div>
                    `;
                    container.appendChild(sectionDivider);
                }

                const qBlock = document.createElement('div');
                qBlock.className = "mb-10 p-6 bg-zinc-50/50 rounded-xl border border-zinc-100 hover:border-zinc-300 transition-colors";

                const qTitle = document.createElement('h3');
                qTitle.className = "font-semibold text-zinc-900 mb-5 text-base md:text-lg leading-relaxed";
                qTitle.innerHTML = `<span class="bg-zinc-900 text-white px-2 py-1 rounded text-sm mr-2 shadow-sm">Q${questionCounter}</span> ${qObj.q}`;
                qBlock.appendChild(qTitle);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = "flex flex-col gap-3";
                
                const answerDiv = document.createElement('div');
                answerDiv.className = "answer-block mt-6 clrs-proof rounded-lg";
                answerDiv.innerHTML = `
                    <h4 class="font-bold text-zinc-900 mb-3 flex items-center"><i class="fa-solid fa-graduation-cap text-blue-600 mr-2"></i> Lời giải & Phân tích chi tiết:</h4>
                    <div class="text-zinc-700 space-y-2 leading-relaxed">${qObj.explanation}</div>
                    <p class="text-xs font-mono text-zinc-500 mt-4 pt-3 border-t border-zinc-200"><i class="fa-solid fa-book-bookmark mr-2"></i>Tham chiếu giáo trình: ${qObj.citation}</p>
                `;

                let isAnswered = false;

                qObj.options.forEach((optText, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn text-left px-5 py-4 rounded-lg border border-zinc-200 text-zinc-700 bg-white hover:bg-zinc-50 hover:border-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm md:text-base font-medium shadow-sm";
                    
                    const charLabel = String.fromCharCode(65 + optIndex);
                    btn.innerHTML = `<span class="font-bold w-8 inline-block text-zinc-400">${charLabel}.</span> ${optText}`;

                    btn.addEventListener('click', () => {
                        if (isAnswered) return;
                        isAnswered = true;

                        const allBtns = optionsGrid.querySelectorAll('button');
                        allBtns.forEach((b, i) => {
                            b.classList.add('disabled');
                            b.classList.remove('hover:bg-zinc-50', 'hover:border-zinc-400');
                            
                            if (i === qObj.correct) {
                                b.classList.add('show-correct');
                                b.innerHTML += `<i class="fa-solid fa-check-circle float-right mt-1 text-emerald-600 text-lg"></i>`;
                            } 
                            else if (i === optIndex && i !== qObj.correct) {
                                b.classList.add('selected-wrong');
                                b.innerHTML += `<i class="fa-solid fa-times-circle float-right mt-1 text-rose-600 text-lg"></i>`;
                            }
                        });

                        if (optIndex === qObj.correct) {
                            score++;
                            scoreDisplay.innerText = `Điểm: ${score}/30`;
                            scoreDisplay.classList.add('bg-emerald-100', 'text-emerald-800');
                            setTimeout(() => {
                                scoreDisplay.classList.remove('bg-emerald-100', 'text-emerald-800');
                            }, 500);
                        }

                        if (window.MathJax) {
                            MathJax.typesetPromise([answerDiv]).then(() => {
                                answerDiv.classList.add('show');
                            });
                        } else {
                            answerDiv.classList.add('show');
                        }
                    });

                    optionsGrid.appendChild(btn);
                });

                qBlock.appendChild(optionsGrid);
                qBlock.appendChild(answerDiv);
                container.appendChild(qBlock);
                
                questionCounter++;
            });
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
