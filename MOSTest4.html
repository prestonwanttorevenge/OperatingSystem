                category: "Chương 1: Cơ sở Hệ thống",

                    "Thanh ghi đa năng (General Purpose Registers - EAX, EBX).",

                options: [
                    "Luồng 2 sẽ lập tức chiếm CPU và chạy.",

                ],
                correct: 2,
                explanation: "<b>1. Khái niệm (Học thuật):</b> Vì Kernel không hề biết sự tồn tại của ULT (nó chỉ thấy 1 tiến trình), nên khi ULT 1 gọi System Call làm chặn (block) tiến trình, Kernel sẽ tước CPU của cả tiến trình đó.<br><br><b>2. Phân tích & Dân dã:</b> Kernel là ông sếp, Tiến trình là 1 team, ULT là các nhân viên trong team. Sếp chỉ giao việc cho Team (không biết nhân viên bên trong). Nhân viên 1 (Luồng 1) lên báo sếp 'Cho em đi mua vật tư (Đọc đĩa)'. Sếp lập tức đánh dấu 'Cả Team này đang đi vắng' và dẹp dự án sang một bên. Nhân viên 2 ngồi ở nhà đành chơi xơi nước vì bị sếp thu hồi tài nguyên mất rồi.",
