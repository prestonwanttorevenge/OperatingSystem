    <script>
        const quizData = [
            // ================== PHẦN 1: CƠ SỞ (4 Câu) ==================
            {
                category: "Ôn tập Cơ sở (Bước đệm)",
                q: "Khi Hệ điều hành thực hiện Context Switch (Chuyển ngữ cảnh) giữa 2 tiến trình, nó KHÔNG BẮT BUỘC phải cất giữ thành phần nào vào Process Control Block (PCB)?",
                options: [
                    "Các thanh ghi CPU (Registers).",
                    "Bộ đếm chương trình (Program Counter).",
                    "Nội dung của toàn bộ các biến trong bộ nhớ RAM chính.",
                    "Trạng thái của bộ nhớ (Memory management information)."
                ],
                correct: 2,
                explanation: "<b>1. Khái niệm:</b> Context Switch là quá trình HĐH lưu lại 'trạng thái bề mặt' (ngữ cảnh) của CPU để chuyển sang chạy tiến trình khác.<br><br><b>2. Phân tích:</b> HĐH chỉ lưu các thanh ghi (Registers, PC, SP) vào PCB. Bộ nhớ RAM (chứa các biến, code) vẫn nằm nguyên vị trí cũ trong thanh RAM, HĐH chỉ cần trỏ lại bảng phân trang (Page Table) là xong, không ai rảnh rỗi đi copy hàng Gigabyte RAM vào PCB cả.<br><br><b>3. Chỉ lỗi sai:</b> Đáp án A, B, D sai vì đây là những thành phần BẮT BUỘC phải lưu để tiến trình biết mình đang chạy đến dòng code nào và con trỏ bộ nhớ nằm ở đâu.",
                citation: "Chương 2.1.6: Context Switch Implementation."
            },
            {
                category: "Ôn tập Cơ sở (Bước đệm)",
                q: "Mục đích tối thượng của việc thiết kế kiến trúc Dual-Mode (Chế độ kép User/Kernel) bằng phần cứng là gì?",
                options: [
                    "Tăng tốc độ truy xuất ổ cứng.",
                    "Giảm nhiệt độ của CPU.",
                    "Bảo vệ hệ điều hành và các tiến trình khác khỏi sự can thiệp trái phép hoặc mã độc từ một tiến trình người dùng đang chạy.",
                    "Cho phép ứng dụng tự biên dịch bằng mã máy."
                ],
                correct: 2,
                explanation: "<b>1. Khái niệm:</b> Dual-Mode chia quyền hạn phần cứng. Kernel mode có toàn quyền, User mode bị cấm chạy lệnh nguy hiểm (ngắt, quản lý RAM).<br><br><b>2. Phân tích:</b> Nếu không có Dual-Mode, mọi ứng dụng đều là 'Vua'. Một ứng dụng bị lỗi hoặc dính virus có thể xóa luôn RAM của HĐH khiến máy tính sụp đổ (Blue Screen). Dual-mode nhốt ứng dụng vào một cái lồng an toàn.<br><br><b>3. Chỉ lỗi sai:</b> A, B, D sai vì Mode bit không giúp chạy nhanh hơn hay mát hơn, nó chỉ sinh ra ngắt (Trap) khi có vi phạm để bảo vệ hệ thống.",
                citation: "Chương 1.3: Dual-Mode Operation."
            },
            {
                category: "Ôn tập Cơ sở (Bước đệm)",
                q: "Hệ thống gọi (System Call) giao tiếp với HĐH thông qua cơ chế nào dưới mức hợp ngữ (Assembly)?",
                options: [
                    "Gọi hàm Call như một thư viện tĩnh bình thường.",
                    "Gửi email đến Kernel.",
                    "Nạp các tham số vào thanh ghi, sau đó kích hoạt lệnh Ngắt Phần Mềm (Trap/Software Interrupt) để CPU chuyển quyền điều khiển sang Kernel Mode.",
                    "Sử dụng lệnh Jump (JMP) nhảy thẳng vào địa chỉ bộ nhớ của Kernel."
                ],
                correct: 2,
                explanation: "<b>1. Khái niệm:</b> Ứng dụng không thể gọi trực tiếp hàm của Kernel vì bị rào cản Mode Bit. Nó phải dùng Trap.<br><br><b>2. Phân tích:</b> Quá trình diễn ra: 1. Đặt tham số vào Register (ví dụ EAX = 4 là lệnh Write). 2. Gọi lệnh <code>INT 0x80</code> (Trap). CPU lập tức đổi Mode=0, nhảy vào Interrupt Vector, tìm đúng hàm xử lý của HĐH để chạy.<br><br><b>3. Chỉ lỗi sai:</b> A sai vì gọi hàm thường không đổi được Mode bit. D sai vì nhảy thẳng vào Kernel khi đang ở User Mode sẽ bị phần cứng bắn lỗi (Access Violation) lập tức.",
                citation: "Chương 1.4: System Calls mechanism."
            },
            {
                category: "Ôn tập Cơ sở (Bước đệm)",
                q: "Trong Hệ điều hành đa nhiệm (Multiprogramming), thuật ngữ 'I/O Bound Process' ám chỉ loại tiến trình nào?",
                options: [
                    "Tiến trình liên tục ngốn 100% CPU để giải các bài toán mã hóa phức tạp.",
                    "Tiến trình thường xuyên thực hiện thao tác Đọc/Ghi đĩa, mạng hoặc bàn phím, do đó nó dành phần lớn vòng đời để nằm ở trạng thái Blocked (Chờ đợi).",
                    "Tiến trình bị treo do lỗi bộ nhớ.",
                    "Tiến trình đồ họa 3D."
                ],
                correct: 1,
                explanation: "<b>1. Khái niệm:</b> I/O Bound (Hướng I/O) là tiến trình sử dụng rất ít CPU, chủ yếu chờ thiết bị ngoại vi. Ngược lại, CPU Bound (Hướng CPU) dùng CPU liên tục để tính toán.<br><br><b>2. Phân tích:</b> Ứng dụng gõ văn bản (Word) là I/O Bound. Nó chớp CPU 1 mili-giây để in chữ lên màn hình, rồi đi ngủ cả giây đồng hồ để chờ bạn gõ phím tiếp theo. HĐH rất thích các tiến trình này vì chúng nhường CPU rất lịch sự.<br><br><b>3. Chỉ lỗi sai:</b> A và D là CPU Bound (Cày game, mã hóa). C là tiến trình lỗi (Terminated/Zombie).",
                citation: "Chương 2.4.2: CPU Bound vs I/O Bound."
            },

            // ================== PHẦN 2: TIẾN TRÌNH & LUỒNG (8 Câu) ==================
            {
                category: "Tiến trình & Luồng (Trọng tâm)",
                q: "Sự kiện nào làm cho một Tiến trình chuyển từ trạng thái RUNNING sang trạng thái READY?",
                options: [
                    "Tiến trình gọi lệnh xin cấp phát thêm RAM nhưng RAM đã hết.",
                    "Tiến trình gọi lệnh Đọc ổ đĩa cứng (I/O).",
                    "Bộ định thời (Scheduler) phát hiện tiến trình đã dùng hết khoảng thời gian Quantum (Time slice) cho phép, hoặc có một tiến trình ưu tiên cao hơn chen ngang (Preempt).",
                    "Tiến trình tự gọi hàm exit()."
                ],
                correct: 2,
                explanation: "<b>1. Khái niệm:</b> Trạng thái Ready là trạng thái tiến trình MỌI THỨ ĐÃ SẴN SÀNG, chỉ thiếu mỗi CPU. Nó đang đứng xếp hàng chờ HĐH gọi tên.<br><br><b>2. Phân tích:</b> Khi hết giờ Quantum, HĐH tước CPU (Running) và ném tiến trình ra sau lưng (về hàng đợi Ready). Tiến trình không thiếu dữ liệu, chỉ thiếu giờ chạy.<br><br><b>3. Chỉ lỗi sai:</b> Đáp án A và B sai vì khi thiếu tài nguyên/dữ liệu cứng, tiến trình chuyển sang BLOCKED (ngủ đông), không phải Ready. D sai vì gọi exit thì chuyển sang TERMINATED.",
                citation: "Chương 2.1.2: Process States transitions."
            },
            {
                category: "Tiến trình & Luồng (Trọng tâm)",
                q: "Hai Luồng (Threads) chạy bên trong CÙNG MỘT Tiến trình sẽ chia sẻ (Share) các tài nguyên nào sau đây?",
                options: [
                    "Con trỏ lệnh (Program Counter) và Các thanh ghi (Registers).",
                    "Không gian địa chỉ ảo (Address Space), Mã nguồn (Text), Biến toàn cục (Global data) và File đang mở.",
                    "Ngăn xếp (Stack) chứa biến cục bộ.",
                    "Không chia sẻ gì cả."
                ],
                correct: 1,
                explanation: "<b>1. Khái niệm:</b> Triết lý của Đa luồng là 'Cùng chung một nhà'. Mọi luồng trong tiến trình đều thấy chung biến toàn cục và chung các file đã mở.<br><br><b>2. Phân tích:</b> Đây là lợi thế của Luồng (giao tiếp cực nhanh không qua OS) và cũng là yếu điểm (Rất dễ ghi đè dữ liệu của nhau gây Race Condition).<br><br><b>3. Chỉ lỗi sai:</b> Đáp án A và C sai nghiêm trọng. Mỗi luồng phải có PC riêng (để biết chạy hàm nào) và Stack riêng (để chứa biến cục bộ của hàm đó, tránh giẫm đạp biến của luồng khác).",
                citation: "Chương 2.2.2: Thread Usage (Shared vs Per-Thread items)."
            },
            {
                category: "Tiến trình & Luồng (Trọng tâm)",
                q: "Vì sao việc khởi tạo Tiến trình mới (Process) lại 'đắt đỏ' và chậm hơn rất nhiều so với khởi tạo Luồng mới (Thread)?",
                options: [
                    "Vì tạo Tiến trình phải mua bản quyền HĐH.",
                    "Vì tạo Luồng không cần RAM.",
                    "Tạo Tiến trình đòi hỏi HĐH phải phân bổ một Không gian Địa chỉ hoàn toàn mới, cấp bảng phân trang mới (Page Table), sao chép dữ liệu; trong khi Luồng mới chỉ cần cấp phát một Stack nhỏ trong Không gian Địa chỉ có sẵn.",
                    "Vì Tiến trình chạy trên ổ cứng, Luồng chạy trên CPU."
                ],
                correct: 2,
                explanation: "<b>1. Khái niệm:</b> Tiến trình là đơn vị sở hữu tài nguyên (Resource Grouping). Luồng là đơn vị thực thi (Execution).<br><br><b>2. Phân tích:</b> Xây nhà mới (Tạo Tiến trình) bạn phải mua đất mới, xin sổ đỏ mới, kéo điện nước mới (Tạo Address Space, Page Table). Thêm người vào ở chung nhà (Tạo Luồng) bạn chỉ cần mua thêm 1 cái giường (Stack) kê vào phòng trống. Nhanh hơn gấp 10-100 lần!<br><br><b>3. Chỉ lỗi sai:</b> A, B, D là các lý luận phản khoa học. Luồng vẫn cần RAM cho Stack và TCB (Thread Control Block).",
                citation: "Chương 2.2: Thread Performance vs Processes."
            },
            {
                category: "Tiến trình & Luồng (Trọng tâm)",
                q: "Nhược điểm chí mạng của mô hình Luồng Mức Người Dùng (User-Level Threads - ULT) khiến nó ít được sử dụng đơn độc trong các ứng dụng mạng hiện đại là gì?",
                options: [
                    "Chi phí chuyển ngữ cảnh (Context switch) giữa các luồng ULT quá chậm.",
                    "Nếu một luồng gọi System Call để chờ dữ liệu mạng (Blocked), Kernel sẽ tước CPU của toàn bộ Tiến trình, làm cho các luồng khác dù đang rảnh rỗi cũng bị đóng băng theo.",
                    "ULT không thể lập trình bằng C/C++.",
                    "ULT đòi hỏi HĐH phải tạo quá nhiều Thread Control Block (TCB) gây cạn kiệt RAM."
                ],
                correct: 1,
                explanation: "<b>1. Khái niệm:</b> ULT được quản lý bởi Thư viện luồng trong không gian User. HĐH (Kernel) hoàn toàn mù tịt về sự tồn tại của ULT, nó chỉ thấy 1 cục Tiến trình duy nhất.<br><br><b>2. Phân tích:</b> Một nhân viên (ULT) lên phường (Kernel) xin giấy tờ và bị giữ lại chờ. Phường thấy anh này là người của Công ty A, liền niêm phong cấm cả Công ty A hoạt động cho đến khi có giấy. Các nhân viên khác ở nhà tự nhiên bị treo mỏ oan uổng.<br><br><b>3. Chỉ lỗi sai:</b> A sai vì ULT chuyển ngữ cảnh CỰC NHANH (do không qua Kernel). D sai vì TCB của ULT nằm ở RAM người dùng, không làm kẹt Kernel (KLT mới bị lỗi D).",
                citation: "Chương 2.2.4: Implementing Threads in User Space (Disadvantages)."
            },
            {
                category: "Tiến trình & Luồng (Trọng tâm)",
                q: "Luồng mức Hạt nhân (Kernel-Level Threads - KLT) giải quyết triệt để khuyết điểm của ULT bằng cách nào?",
                options: [
                    "Không cho phép các luồng gọi System Call.",
                    "HĐH (Kernel) trực tiếp duy trì Bảng Luồng (Thread Table). Khi một luồng bị Blocked do I/O, HĐH nhận thức được các luồng khác vẫn còn sống và sẽ cấp CPU cho luồng rảnh rỗi đó chạy tiếp.",
                    "Bỏ hoàn toàn khái niệm Tiến trình.",
                    "Chạy toàn bộ mã của người dùng trong Kernel Mode."

                    sectionDivider.className = "mt-16 mb-8";
                    sectionDivider.id = `section-${currentCategory}`;
                    sectionDivider.innerHTML = `
                        <div class="flex items-center gap-4">
                            <h2 class="text-lg md:text-xl font-bold uppercase tracking-widest text-zinc-900 border-l-4 border-red-700 pl-4 py-1">${currentCategory}</h2>
                            <div class="h-px bg-zinc-200 flex-grow"></div>
                        </div>
                    `;
                    container.appendChild(sectionDivider);
                }

                const qBlock = document.createElement('div');
                qBlock.className = "mb-10 p-6 bg-zinc-50/50 rounded-xl border border-zinc-100 hover:border-zinc-300 transition-colors shadow-sm";

                const qTitle = document.createElement('h3');
                qTitle.className = "font-semibold text-zinc-900 mb-5 text-base md:text-lg leading-relaxed";
                qTitle.innerHTML = `<span class="bg-red-700 text-white px-2 py-1 rounded text-sm mr-2 shadow-sm">Q${questionCounter}</span> ` + qObj.q.replace(/<br>/g, '<br>');
                qBlock.appendChild(qTitle);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = "flex flex-col gap-3";
                
                const answerDiv = document.createElement('div');
                answerDiv.className = "answer-block mt-6 clrs-proof rounded-lg";
                answerDiv.innerHTML = `
                    <h4 class="font-bold text-zinc-900 mb-3 flex items-center"><i class="fa-solid fa-lightbulb text-red-700 mr-2"></i> Ôn Tập & Phân Tích (Sửa Lỗi):</h4>
                    <div class="text-zinc-700 space-y-2 leading-relaxed">${qObj.explanation}</div>
                    <p class="text-xs font-mono text-zinc-500 mt-4 pt-3 border-t border-zinc-200"><i class="fa-solid fa-book-bookmark mr-2"></i>Tham chiếu giáo trình: ${qObj.citation}</p>
                `;

                let isAnswered = false;

                qObj.options.forEach((optText, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn text-left px-5 py-4 rounded-lg border border-zinc-200 text-zinc-700 bg-white hover:bg-zinc-50 hover:border-red-400 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm md:text-base font-medium shadow-sm transition";
                    
                    const charLabel = String.fromCharCode(65 + optIndex);
                    btn.innerHTML = `<span class="font-bold w-8 inline-block text-zinc-400">${charLabel}.</span> ${optText}`;

                    btn.addEventListener('click', () => {
                        if (isAnswered) return;
                        isAnswered = true;

                        const allBtns = optionsGrid.querySelectorAll('button');
                        allBtns.forEach((b, i) => {
                            b.classList.add('disabled');
                            b.classList.remove('hover:bg-zinc-50', 'hover:border-red-400');
                            
                            if (i === qObj.correct) {
                                b.classList.add('show-correct');
                                b.innerHTML += `<i class="fa-solid fa-check-circle float-right mt-1 text-emerald-600 text-lg"></i>`;
                            } 
                            else if (i === optIndex && i !== qObj.correct) {
                                b.classList.add('selected-wrong');
                                b.innerHTML += `<i class="fa-solid fa-times-circle float-right mt-1 text-red-600 text-lg"></i>`;
                            }
                        });

                        if (optIndex === qObj.correct) {
                            score++;
                            scoreDisplay.innerText = `Điểm: ${score}/30`;
                            scoreDisplay.classList.add('bg-emerald-100', 'text-emerald-800');
                            setTimeout(() => {
                                scoreDisplay.classList.remove('bg-emerald-100', 'text-emerald-800');
                            }, 500);
                        }

                        if (window.MathJax) {
                            MathJax.typesetPromise([answerDiv]).then(() => {
                                answerDiv.classList.add('show');
                            });
                        } else {
                            answerDiv.classList.add('show');
                        }
                    });

                    optionsGrid.appendChild(btn);
                });

                qBlock.appendChild(optionsGrid);
                qBlock.appendChild(answerDiv);
                container.appendChild(qBlock);
                
                questionCounter++;
            });
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
